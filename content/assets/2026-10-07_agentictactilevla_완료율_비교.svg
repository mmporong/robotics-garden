<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">AgenticTactileVLA 완료율 비교</title>
  <desc id="desc">기준 VLA 61.3퍼센트, 매번 끝까지 닫는 방법 72.0퍼센트, 감독기 84.0퍼센트의 완료율 비교</desc>
  <rect width="960" height="520" fill="#fff"/>
  <text x="80" y="55" fill="#172033" font-family="Pretendard, sans-serif" font-size="26" font-weight="700">고정 예산에서의 과제 완료율</text>
  <text x="80" y="84" fill="#5d6678" font-family="Pretendard, sans-serif" font-size="16">학습에 쓰지 않은 다섯 물체, 물체·조건마다 15회</text>
  <g stroke="#dce2eb" stroke-width="1">
    <line x1="190" y1="130" x2="880" y2="130"/><line x1="190" y1="205" x2="880" y2="205"/><line x1="190" y1="280" x2="880" y2="280"/><line x1="190" y1="355" x2="880" y2="355"/><line x1="190" y1="430" x2="880" y2="430"/>
  </g>
  <g fill="#697386" font-family="Pretendard, sans-serif" font-size="14" text-anchor="end"><text x="175" y="435">0%</text><text x="175" y="360">25%</text><text x="175" y="285">50%</text><text x="175" y="210">75%</text><text x="175" y="135">100%</text></g>
