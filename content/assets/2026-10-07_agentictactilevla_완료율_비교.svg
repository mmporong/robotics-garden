  <rect x="680" y="178" width="130" height="252" rx="10" fill="#1677c8"/>
  <g fill="#172033" font-family="Pretendard, sans-serif" text-anchor="middle"><text x="325" y="228" font-size="25" font-weight="700">61.3%</text><text x="535" y="196" font-size="25" font-weight="700">72.0%</text><text x="745" y="160" font-size="25" font-weight="700">84.0%</text><text x="325" y="465" font-size="17">기준 VLA</text><text x="535" y="465" font-size="17">매번 더 닫기</text><text x="745" y="465" font-size="17">감독기</text></g>
  <text x="880" y="490" fill="#697386" font-family="Pretendard, sans-serif" font-size="13" text-anchor="end">출처 데이터: Semenyakina et al., arXiv:2610.04391v1</text>
