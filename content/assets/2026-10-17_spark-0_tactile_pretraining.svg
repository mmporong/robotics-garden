<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Spark-0의 촉각 사전학습 규모별 성공률</title>
  <desc id="desc">시각 전용, HumanTouch 촉각 100시간, 1000시간 조건을 SparkArena 시뮬레이션, Ego Humanoid, SparkArena 실제 로봇에서 비교한다. 1000시간 조건의 성공률은 각각 36.86, 71.72, 52.00퍼센트다.</desc>
  <style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#253044}.title{font-size:31px;font-weight:700}.sub{font-size:18px;fill:#667085}.axis{stroke:#98a2b3;stroke-width:2}.grid{stroke:#e4e7ec;stroke-width:1.5}.label{font-size:17px}.value{font-size:18px;font-weight:700}.note{font-size:16px;fill:#667085}</style>
  <rect width="1200" height="650" fill="#fff"/><text x="64" y="58" class="title">Spark-0: 촉각 사전학습 규모에 따른 성공률</text><text x="64" y="90" class="sub">원문 표 4 · 시각 전용과 촉각 조건은 같은 RGB 데이터·계산량으로 비교</text>
  <line x1="108" y1="510" x2="1140" y2="510" class="axis"/><line x1="108" y1="408" x2="1140" y2="408" class="grid"/><line x1="108" y1="306" x2="1140" y2="306" class="grid"/><line x1="108" y1="204" x2="1140" y2="204" class="grid"/><line x1="108" y1="102" x2="1140" y2="102" class="grid"/>
  <text x="68" y="516" class="note">0</text><text x="58" y="414" class="note">25</text><text x="58" y="312" class="note">50</text><text x="58" y="210" class="note">75</text><text x="50" y="108" class="note">100</text>
  <g fill="#98a2b3"><rect x="176" y="361" width="62" height="149" rx="5"/><rect x="520" y="296" width="62" height="214" rx="5"/><rect x="864" y="331" width="62" height="179" rx="5"/></g><g fill="#5b8ff9"><rect x="252" y="367" width="62" height="143" rx="5"/><rect x="596" y="267" width="62" height="243" rx="5"/><rect x="940" y="347" width="62" height="163" rx="5"/></g><g fill="#1570ef"><rect x="328" y="360" width="62" height="150" rx="5"/><rect x="672" y="217" width="62" height="293" rx="5"/><rect x="1016" y="298" width="62" height="212" rx="5"/></g>
  <g class="value"><text x="181" y="346">36.57%</text><text x="257" y="352">35.14%</text><text x="333" y="345">36.86%</text><text x="525" y="281">52.45%</text><text x="601" y="252">59.42%</text><text x="677" y="202">71.72%</text><text x="869" y="316">44.00%</text><text x="945" y="332">40.00%</text><text x="1021" y="283">52.00%</text></g>
  <text x="165" y="542" class="label">SparkArena-Sim</text><text x="535" y="542" class="label">Ego Humanoid</text><text x="850" y="542" class="label">SparkArena-Real</text><rect x="64" y="580" width="18" height="18" rx="3" fill="#98a2b3"/><text x="92" y="595" class="note">시각 전용 사전학습</text><rect x="304" y="580" width="18" height="18" rx="3" fill="#5b8ff9"/><text x="332" y="595" class="note">HumanTouch 촉각 100시간</text><rect x="640" y="580" width="18" height="18" rx="3" fill="#1570ef"/><text x="668" y="595" class="note">HumanTouch 촉각 1,000시간</text><text x="64" y="628" class="note">Ego Humanoid는 촉각 없이 실행했고, SparkArena-Real은 촉각을 실행 입력으로 썼습니다.</text>
</svg>
