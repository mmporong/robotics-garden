<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">DEFT-VLA와 과제별 가장 높은 비교 방법의 전체 성공률</title>
  <desc id="desc">파이펫 팁 결합, 양팔 파이펫 흡입, 화이트보드 닦기에서 DEFT-VLA의 전체 성공률은 각각 70, 50, 90퍼센트였고, 각 과제에서 가장 높은 비교 방법은 30, 30, 70퍼센트였다.</desc>
  <style>
    text { font-family: 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif; fill: #253044; }
    .title { font-size: 31px; font-weight: 700; }
    .sub { font-size: 18px; fill: #667085; }
    .axis { stroke: #98a2b3; stroke-width: 2; }
    .grid { stroke: #e4e7ec; stroke-width: 1.5; }
    .label { font-size: 18px; }
    .value { font-size: 21px; font-weight: 700; }
    .note { font-size: 16px; fill: #667085; }
  </style>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="64" y="58" class="title">DEFT-VLA: 접촉 구간 분리가 만든 전체 성공률 차이</text>
  <text x="64" y="90" class="sub">원문 표 I · 과제별 실제 로봇 20회 평가 · 전체 과제를 끝낸 비율</text>
  <line x1="112" y1="500" x2="1140" y2="500" class="axis"/>
  <line x1="112" y1="400" x2="1140" y2="400" class="grid"/>
  <line x1="112" y1="300" x2="1140" y2="300" class="grid"/>
  <line x1="112" y1="200" x2="1140" y2="200" class="grid"/>
  <line x1="112" y1="100" x2="1140" y2="100" class="grid"/>
  <text x="70" y="506" class="note">0</text><text x="58" y="406" class="note">25</text><text x="58" y="306" class="note">50</text><text x="58" y="206" class="note">75</text><text x="50" y="106" class="note">100</text>
  <rect x="198" y="380" width="92" height="120" rx="6" fill="#98a2b3"/>
  <rect x="306" y="220" width="92" height="280" rx="6" fill="#1570ef"/>
  <rect x="540" y="380" width="92" height="120" rx="6" fill="#98a2b3"/>
  <rect x="648" y="300" width="92" height="200" rx="6" fill="#1570ef"/>
  <rect x="882" y="220" width="92" height="280" rx="6" fill="#98a2b3"/>
  <rect x="990" y="140" width="92" height="360" rx="6" fill="#1570ef"/>
  <text x="219" y="362" class="value">30%</text><text x="327" y="202" class="value">70%</text>
  <text x="561" y="362" class="value">30%</text><text x="669" y="282" class="value">50%</text>
  <text x="903" y="202" class="value">70%</text><text x="1011" y="122" class="value">90%</text>
  <text x="171" y="536" class="label">파이펫 팁 결합</text><text x="513" y="536" class="label">양팔 파이펫 흡입</text><text x="864" y="536" class="label">화이트보드 닦기</text>
  <rect x="64" y="564" width="18" height="18" rx="3" fill="#98a2b3"/><text x="92" y="579" class="note">과제별 가장 높은 비교 방법</text>
  <rect x="364" y="564" width="18" height="18" rx="3" fill="#1570ef"/><text x="392" y="579" class="note">DEFT-VLA</text>
  <text x="760" y="579" class="note">원문 표 I 수치를 새 차트로 정리했습니다.</text>
</svg>
