<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">GIFT와 기준 모델의 LIBERO-Plus 제로샷 성공률 비교</title>
  <desc id="desc">GIFT-VLA 79.6%, GIFT-WAM-Fast 72.6%, GIFT-WAM-IDM 87.8%이며 각각 기준 모델보다 4.6, 12.6, 5.2 퍼센트포인트 높다.</desc>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="80" y="85" fill="#172033" font-family="Noto Sans CJK KR, sans-serif" font-size="35" font-weight="700">LIBERO-Plus 제로샷 전이: 전체 성공률</text>
  <text x="80" y="125" fill="#526070" font-family="Noto Sans CJK KR, sans-serif" font-size="22">원문 표 2 재구성 · 기본 LIBERO만 학습, 교란 조건에는 미세조정하지 않음</text>
  <g font-family="Noto Sans CJK KR, sans-serif" font-size="20" fill="#526070">
    <text x="80" y="185">성공률(%)</text><text x="1150" y="185">기준 모델</text><text x="1150" y="212" fill="#0b7668">GIFT</text>
    <text x="80" y="280" fill="#172033" font-size="25" font-weight="700">VLA</text><text x="80" y="455" fill="#172033" font-size="25" font-weight="700">WAM-Fast</text><text x="80" y="630" fill="#172033" font-size="25" font-weight="700">WAM-IDM</text>
  </g>
  <g fill="#d4dce5"><rect x="255" y="235" width="600" height="33" rx="4"/><rect x="255" y="410" width="480" height="33" rx="4"/><rect x="255" y="585" width="660.8" height="33" rx="4"/></g>
  <g fill="#0b7668"><rect x="255" y="282" width="636.8" height="33" rx="4"/><rect x="255" y="457" width="580.8" height="33" rx="4"/><rect x="255" y="632" width="702.4" height="33" rx="4"/></g>
  <g font-family="Noto Sans CJK KR, sans-serif" font-size="22" font-weight="700"><text x="870" y="260" fill="#526070">75.0%</text><text x="911" y="307" fill="#0b7668">79.6%  (+4.6p)</text><text x="750" y="435" fill="#526070">60.0%</text><text x="851" y="482" fill="#0b7668">72.6%  (+12.6p)</text><text x="931" y="610" fill="#526070">82.6%</text><text x="973" y="657" fill="#0b7668">87.8%  (+5.2p)</text></g>
