  <g font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#526070"><text x="250" y="715">0</text><text x="445" y="715">25</text><text x="645" y="715">50</text><text x="845" y="715">75</text><text x="1035" y="715">100</text></g>
