<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">RARA와 일반 파인튜닝의 시뮬레이션 조작 성공률</title>
  <desc id="desc">RoboTwin과 RoboCasa에서 학습 시연과 같은 조건, 달라진 조건의 평균 성공률을 비교한 막대그래프</desc>
  <rect width="1200" height="620" fill="#ffffff"/>
  <style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#1f2937}.t{font-size:28px;font-weight:700}.s{font-size:18px;fill:#4b5563}.h{font-size:19px;font-weight:700}.l{font-size:16px;fill:#4b5563}.v{font-size:17px;font-weight:700}.grid{stroke:#d1d5db;stroke-width:1}.axis{stroke:#6b7280;stroke-width:1.5}.ft{fill:#94a3b8}.rara{fill:#0f766e}</style>
  <text class="t" x="72" y="58">RARA가 일반 파인튜닝보다 높인 시뮬레이션 조작 성공률</text>
  <text class="s" x="72" y="88">원문 Table 2의 과제 평균, 단위: 성공률(%) · ID는 학습 시연과 같은 조건, OOD는 카메라·배경·물체 등이 달라진 조건</text>
  <rect x="815" y="118" width="18" height="18" class="ft"/><text class="l" x="842" y="133">일반 파인튜닝(FT)</text>
  <rect x="1010" y="118" width="18" height="18" class="rara"/><text class="l" x="1037" y="133">RARA</text>
  <line class="axis" x1="105" y1="520" x2="1140" y2="520"/>
  <line class="axis" x1="105" y1="160" x2="105" y2="520"/>
  <g class="grid"><line x1="105" y1="448" x2="1140" y2="448"/><line x1="105" y1="376" x2="1140" y2="376"/><line x1="105" y1="304" x2="1140" y2="304"/><line x1="105" y1="232" x2="1140" y2="232"/><line x1="105" y1="160" x2="1140" y2="160"/></g>
  <g class="l"><text x="70" y="525">0</text><text x="60" y="453">20</text><text x="60" y="381">40</text><text x="60" y="309">60</text><text x="60" y="237">80</text><text x="51" y="165">100</text></g>
  <rect class="ft" x="180" y="277.4" width="78" height="242.6"/><rect class="rara" x="270" y="246.4" width="78" height="273.6"/>
  <text class="v" x="196" y="267">67.4</text><text class="v" x="286" y="236">76.0</text>
  <text class="h" x="189" y="557">RoboTwin</text><text class="l" x="217" y="582">ID</text>
  <rect class="ft" x="425" y="349.7" width="78" height="170.3"/><rect class="rara" x="515" y="310.1" width="78" height="209.9"/>
  <text class="v" x="441" y="339">47.3</text><text class="v" x="531" y="300">58.3</text>
  <text class="h" x="434" y="557">RoboTwin</text><text class="l" x="452" y="582">OOD</text>
  <rect class="ft" x="670" y="270.9" width="78" height="249.1"/><rect class="rara" x="760" y="253.6" width="78" height="266.4"/>
  <text class="v" x="686" y="261">69.2</text><text class="v" x="776" y="244">74.0</text>
  <text class="h" x="679" y="557">RoboCasa</text><text class="l" x="707" y="582">ID</text>
  <rect class="ft" x="915" y="360.5" width="78" height="159.5"/><rect class="rara" x="1005" y="320.2" width="78" height="199.8"/>
  <text class="v" x="931" y="350">44.3</text><text class="v" x="1021" y="310">55.5</text>
  <text class="h" x="924" y="557">RoboCasa</text><text class="l" x="942" y="582">OOD</text>
</svg>
