<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">로봇 포트폴리오의 다섯 검증 관문</title>
  <desc id="desc">기존 코드와 센서 경로 파악부터 SIL, 특징 지도, 반복 시험, HIL 안전 검증까지 단계별 질문과 증거를 보여 주는 흐름도</desc>
  <rect width="1200" height="720" fill="#fbfcfe"/>
  <text x="600" y="58" text-anchor="middle" font-family="'Noto Sans CJK KR', sans-serif" font-size="28" font-weight="700" fill="#172033">움직임을 원인과 재현성으로 바꾸는 다섯 관문</text>
  <text x="600" y="91" text-anchor="middle" font-family="'Noto Sans CJK KR', sans-serif" font-size="16" fill="#536179">각 단계는 다음 단계로 넘어가기 전에 남겨야 할 포트폴리오 증거를 뜻해요</text>

  <g font-family="'Noto Sans CJK KR', sans-serif">
    <g transform="translate(52 142)">
      <rect width="196" height="438" rx="18" fill="#ffffff" stroke="#2f6fed" stroke-width="3"/>
      <circle cx="98" cy="62" r="28" fill="#e9f0ff"/>
      <text x="98" y="71" text-anchor="middle" font-size="25" font-weight="700" fill="#2f6fed">1</text>
      <text x="98" y="119" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">구조 파악</text>
      <line x1="28" y1="145" x2="168" y2="145" stroke="#d9e1ec"/>
      <text x="24" y="184" font-size="15" font-weight="700" fill="#536179">확인할 질문</text>
      <text x="24" y="215" font-size="14" fill="#172033">센서 입력은 맞나?</text>
      <text x="24" y="242" font-size="14" fill="#172033">통신은 살아 있나?</text>
      <text x="24" y="269" font-size="14" fill="#172033">판정과 구동은</text>
      <text x="24" y="291" font-size="14" fill="#172033">어디서 나뉘나?</text>
      <text x="24" y="340" font-size="15" font-weight="700" fill="#536179">남길 근거</text>
      <text x="24" y="371" font-size="14" fill="#172033">설정값 · 네트워크</text>
      <text x="24" y="398" font-size="14" fill="#172033">센서 원본값 · 로그</text>
    </g>

    <path d="M254 361 H276" stroke="#8ca0bd" stroke-width="3" fill="none"/>
    <path d="M276 361 l-10 -7 v14 z" fill="#8ca0bd"/>

    <g transform="translate(278 142)">
      <rect width="196" height="438" rx="18" fill="#ffffff" stroke="#667eea" stroke-width="3"/>
      <circle cx="98" cy="62" r="28" fill="#eef0ff"/>
      <text x="98" y="71" text-anchor="middle" font-size="25" font-weight="700" fill="#667eea">2</text>
      <text x="98" y="119" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">SIL</text>
      <line x1="28" y1="145" x2="168" y2="145" stroke="#d9e1ec"/>
      <text x="24" y="184" font-size="15" font-weight="700" fill="#536179">확인할 질문</text>
      <text x="24" y="215" font-size="14" fill="#172033">스크립트 데이터로</text>
      <text x="24" y="242" font-size="14" fill="#172033">입출력과 상태 전환이</text>
      <text x="24" y="269" font-size="14" fill="#172033">먼저 작동하는가?</text>
      <text x="24" y="340" font-size="15" font-weight="700" fill="#536179">남길 근거</text>
      <text x="24" y="371" font-size="14" fill="#172033">고정 시드 · 성공 조건</text>
      <text x="24" y="398" font-size="14" fill="#172033">예외 입력 · 재생 로그</text>
    </g>

    <path d="M480 361 H502" stroke="#8ca0bd" stroke-width="3" fill="none"/>
    <path d="M502 361 l-10 -7 v14 z" fill="#8ca0bd"/>

    <g transform="translate(504 142)">
      <rect width="196" height="438" rx="18" fill="#ffffff" stroke="#8b5cf6" stroke-width="3"/>
      <circle cx="98" cy="62" r="28" fill="#f2edff"/>
      <text x="98" y="71" text-anchor="middle" font-size="25" font-weight="700" fill="#8b5cf6">3</text>
      <text x="98" y="119" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">모델 관찰</text>
      <line x1="28" y1="145" x2="168" y2="145" stroke="#d9e1ec"/>
      <text x="24" y="184" font-size="15" font-weight="700" fill="#536179">확인할 질문</text>
      <text x="24" y="215" font-size="14" fill="#172033">모델은 물체를 보나?</text>
      <text x="24" y="242" font-size="14" fill="#172033">배경과 조명에</text>
      <text x="24" y="269" font-size="14" fill="#172033">끌려가지는 않나?</text>
      <text x="24" y="340" font-size="15" font-weight="700" fill="#536179">남길 근거</text>
      <text x="24" y="371" font-size="14" fill="#172033">특징 지도 · 원본 대조</text>
      <text x="24" y="398" font-size="14" fill="#172033">전처리 전후 실패 프레임</text>
    </g>

    <path d="M706 361 H728" stroke="#8ca0bd" stroke-width="3" fill="none"/>
    <path d="M728 361 l-10 -7 v14 z" fill="#8ca0bd"/>

    <g transform="translate(730 142)">
      <rect width="196" height="438" rx="18" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
      <circle cx="98" cy="62" r="28" fill="#fff3df"/>
      <text x="98" y="71" text-anchor="middle" font-size="25" font-weight="700" fill="#d97706">4</text>
      <text x="98" y="119" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">반복 시험</text>
      <line x1="28" y1="145" x2="168" y2="145" stroke="#d9e1ec"/>
      <text x="24" y="184" font-size="15" font-weight="700" fill="#536179">확인할 질문</text>
      <text x="24" y="215" font-size="14" fill="#172033">조건이 바뀌어도</text>
      <text x="24" y="242" font-size="14" fill="#172033">같은 원리로</text>
      <text x="24" y="269" font-size="14" fill="#172033">성공하는가?</text>
      <text x="24" y="340" font-size="15" font-weight="700" fill="#536179">남길 근거</text>
      <text x="24" y="371" font-size="14" fill="#172033">조건표 · 성공과 실패</text>
      <text x="24" y="398" font-size="14" fill="#172033">분포 · 대표 사례</text>
    </g>

    <path d="M932 361 H954" stroke="#8ca0bd" stroke-width="3" fill="none"/>
    <path d="M954 361 l-10 -7 v14 z" fill="#8ca0bd"/>

    <g transform="translate(956 142)">
      <rect width="196" height="438" rx="18" fill="#ffffff" stroke="#0f9d78" stroke-width="3"/>
      <circle cx="98" cy="62" r="28" fill="#e4f7f1"/>
      <text x="98" y="71" text-anchor="middle" font-size="25" font-weight="700" fill="#0f9d78">5</text>
      <text x="98" y="119" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">HIL</text>
      <line x1="28" y1="145" x2="168" y2="145" stroke="#d9e1ec"/>
      <text x="24" y="184" font-size="15" font-weight="700" fill="#536179">확인할 질문</text>
      <text x="24" y="215" font-size="14" fill="#172033">실제 센서와 구동기에서</text>
      <text x="24" y="242" font-size="14" fill="#172033">지연과 이상값을 견디고</text>
      <text x="24" y="269" font-size="14" fill="#172033">안전하게 멈추는가?</text>
      <text x="24" y="340" font-size="15" font-weight="700" fill="#536179">남길 근거</text>
      <text x="24" y="371" font-size="14" fill="#172033">토크 · 정지 · 복구 조건</text>
      <text x="24" y="398" font-size="14" fill="#172033">실기체 판정과 원본 로그</text>
    </g>
  </g>

  <rect x="172" y="622" width="856" height="54" rx="12" fill="#eef3f9"/>
  <text x="600" y="655" text-anchor="middle" font-family="'Noto Sans CJK KR', sans-serif" font-size="16" font-weight="600" fill="#27364d">완주 영상 + 원인 추적 + 모델 관찰 + 반복성 + 안전 조건이 한 묶음일 때 재현 가능한 설명이 돼요</text>
</svg>
